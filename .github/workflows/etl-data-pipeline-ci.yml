name: ETL Pipeline CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  defaults:
    run:
      working-directory: data-engineering/etl-data-pipeline

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: etl_pipeline
          POSTGRES_USER: etl_user
          POSTGRES_PASSWORD: etl_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U etl_user -d etl_pipeline"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure test environment
        run: |
          cat > .env <<'ENVEOF'
          POSTGRES_HOST=localhost
          POSTGRES_PORT=5432
          POSTGRES_DB=etl_pipeline
          POSTGRES_USER=etl_user
          POSTGRES_PASSWORD=etl_ci_password
          ENVEOF

      - name: Initialize database schema
        run: |
          PGPASSWORD=etl_ci_password psql \
            -h localhost \
            -p 5432 \
            -U etl_user \
            -d etl_pipeline \
            -f sql/schema.sql

      - name: Run tests
        run: pytest -v
